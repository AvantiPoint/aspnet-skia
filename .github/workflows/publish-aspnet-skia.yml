name: Publish aspnet-skia base images

on:
  push:
    paths:
      - aspnet-skia.9.0-noble.Dockerfile
      - aspnet-skia.10.0-noble.Dockerfile
      - .github/workflows/publish-aspnet-skia.yml
  workflow_dispatch: {}
  schedule:
    - cron: "0 5 * * 1"  # weekly refresh for security updates

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant:
          - name: "9.0-noble"
            file: "aspnet-skia.9.0-noble.Dockerfile"
            tags: |
              ghcr.io/avantipoint/aspnet-skia:9.0-noble
              ghcr.io/avantipoint/aspnet-skia:9.0
              ghcr.io/avantipoint/aspnet-skia:9
              ghcr.io/avantipoint/aspnet-skia:latest
          - name: "10.0-noble"
            file: "aspnet-skia.10.0-noble.Dockerfile"
            tags: |
              ghcr.io/avantipoint/aspnet-skia:10.0-noble
              ghcr.io/avantipoint/aspnet-skia:10.0
              ghcr.io/avantipoint/aspnet-skia:10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.variant.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.variant.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ matrix.variant.tags }}
