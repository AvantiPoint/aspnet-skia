name: Publish aspnet-skia base images

on:
  push:
    branches: [master]
    paths:
      - aspnet-skia.10.0-noble.Dockerfile
      - aspnet-skia.11.0-resolute.Dockerfile
      - .github/workflows/publish-aspnet-skia.yml
  pull_request:
    paths:
      - aspnet-skia.10.0-noble.Dockerfile
      - aspnet-skia.11.0-resolute.Dockerfile
      - .github/workflows/publish-aspnet-skia.yml
  workflow_dispatch: {}
  schedule:
    - cron: "0 5 * * 1"  # weekly refresh for security updates

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # PRs validate both architectures without publishing.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant:
          - name: "10.0-noble"
            file: "aspnet-skia.10.0-noble.Dockerfile"
            tags: |
              ghcr.io/avantipoint/aspnet-skia:10.0-noble
              ghcr.io/avantipoint/aspnet-skia:10.0
              ghcr.io/avantipoint/aspnet-skia:10
          - name: "11.0-resolute"
            file: "aspnet-skia.11.0-resolute.Dockerfile"
            tags: |
              ghcr.io/avantipoint/aspnet-skia:11.0-resolute
              ghcr.io/avantipoint/aspnet-skia:11.0
              ghcr.io/avantipoint/aspnet-skia:11
              ghcr.io/avantipoint/aspnet-skia:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.variant.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.variant.file }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ matrix.variant.tags }}
